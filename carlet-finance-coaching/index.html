  function heading(icon,step,title,copy){return `<div class="section-heading"><div class="section-icon">${icon}</div><div><span>Schritt ${step}</span><h2>${title}</h2><p>${copy}</p></div></div>`}

  function docTypeLabel(t){return ({fz:'Freizügigkeit / 2. Säule',p3bank:'Säule 3a · Bank',p3insurance:'Säule 3a · Versicherung',other:'Anderes Vorsorgeguthaben'})[t]||'Noch prüfen'}
  function classify(text){const t=text.toLowerCase(); if(/säule\s*3a|3a-konto|vorsorgevereinbarung/.test(t)) return /(versicherung|police|rückkaufswert)/.test(t)?'p3insurance':'p3bank'; if(/freizügig|austrittsleistung|pensionskasse|berufliche vorsorge/.test(t)) return 'fz'; if(/vorsorge|police/.test(t)) return 'other'; return 'fz'}
  function parseAmount(raw){

  function extractAnchoredAmount(text){

      /aktuelles\s+sparguthaben/i,
      /freizügigkeitsleistung/i,
      /austrittsleistung/i,
      /vorsorgeguthaben(?:\s+per)?/i,
      /kontoguthaben(?:\s+per)?/i,
      /rückkaufswert/i,
      /policenwert/i,
      /altersguthaben(?:\s+per)?/i,
      /saldo(?:\s+per)?/i
    ];
    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      const anchor=anchors.find(rx=>rx.test(line));
      if(!anchor) continue;
      const labelPos=line.search(anchor);
      const same=amountsInText(line).filter(x=>x.index>labelPos);
      if(same.length) return {amount:same[0].amount,score:100,line,context:line,anchored:true};

  }
  function extractAmount(text){

  function plausiblePersonName(line){
    let s=String(line||'').replace(/\s+/g,' ').trim();
    s=s.replace(/^(pers[oö]nlich|persoenlich|frau|herr)\s*[:.-]?\s*/i,'').trim();
    if(!s||s.length<4||s.length>70||/\d|@|www\.|versicherung|vorsorge|pensionskasse|strasse|straße|weg|platz|gasse|postfach|telefon|tel\b|policen|versicherten|arbeitgeber|geburtsdatum/i.test(s))return null;
    const parts=s.split(' ').filter(Boolean);
    if(parts.length<2||parts.length>5)return null;
    if(!parts.every(p=>/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’.-]*$/.test(p)))return null;

  }
  function extractPersonHints(text){
    const lines=textLines(text);

    let addressIndex=-1,streetIndex=-1;

    // Swiss address line, tolerant of OCR punctuation.
    for(let i=0;i<lines.length;i++){
      const normalized=lines[i].replace(/[|,;]/g,' ').replace(/\s+/g,' ').trim();
      const m=normalized.match(/\b([1-9]\d{3})\s+([A-Za-zÄÖÜäöüÀ-ÿ][A-Za-zÄÖÜäöüÀ-ÿ .'-]{2,45})$/);

      for(let j=anchor-1;j>=Math.max(0,anchor-5);j--){

        if(m){firstName=m[1];lastName=m[2];break;}

  function mergeHints(h){ ['firstName','lastName','postalCode','city','street'].forEach(k=>{if(!state.person[k]&&h[k]) state.person[k]=h[k]}) }
  function extractDocumentIdentity(text){
    const t=String(text||'');
    const clean=v=>String(v||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();

  function cleanInstitutionCandidate(s){return String(s||'').replace(/\s+/g,' ').replace(/^[^A-Za-zÄÖÜÀ-ÿ]+|[^A-Za-zÄÖÜÀ-ÿ0-9)]+$/g,'').trim().slice(0,100)}
  function fundMatch(nameOrText){
    const t=String(nameOrText||'').toLocaleLowerCase('de-CH').normalize('NFKD').replace(/[\u0300-\u036f]/g,'');

  function extractInstitution(text){

  }
  function sameLogicalDocument(a,b){
    const ai=a.identity||{},bi=b.identity||{};
    const aInst=String(a.institution||'').toLowerCase(), bInst=String(b.institution||'').toLowerCase();
    if(aInst&&bInst&&aInst!==bInst)return false;
    if(ai.policyNumber&&bi.policyNumber&&ai.policyNumber===bi.policyNumber)return true;
    if(ai.insuredNumber&&bi.insuredNumber&&ai.insuredNumber===bi.insuredNumber)return true;

  function analyzeLogicalDoc(d){

  function mergeRecognizedDocs(){
    const source=state.docs.slice();

      const d=source[i];
      let target=null;
      for(let j=merged.length-1;j>=0;j--){
        // Prefer nearby pages; stop after a few unrelated documents.
        if(merged.length-1-j>2)break;
        if(sameLogicalDocument(merged[j],d)){target=merged[j];break;}
      }
      if(!target){
        d.files=d.files&&d.files.length?d.files:[d.file];
        d.previews=d.previews&&d.previews.length?d.previews:(d.preview?[d.preview]:[]);

      }else{
        target.files=(target.files||[target.file]).concat(d.files&&d.files.length?d.files:[d.file]);
        target.previews=(target.previews||[]).concat(d.previews&&d.previews.length?d.previews:(d.preview?[d.preview]:[]));

    grid.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{
      const i=Number(b.dataset.remove),d=state.docs[i];
      (d?.previews||[d?.preview]).filter(Boolean).forEach(p=>{if(String(p).startsWith('blob:'))URL.revokeObjectURL(p)});
      state.docs.splice(i,1); renderStep2();
    });
    grid.querySelectorAll('[data-type]').forEach(el=>el.onchange=e=>state.docs[Number(el.dataset.type)].type=e.target.value);
    grid.querySelectorAll('[data-amount]').forEach(el=>el.oninput=e=>{const d=state.docs[Number(el.dataset.amount)];d.amount=parseAmount(e.target.value);d.amountManual=true;document.getElementById('nextBtn').disabled=!state.docs.length||!state.docs.every(d=>Number(d.amount)>0)});
    grid.querySelectorAll('[data-institution]').forEach(el=>el.onchange=e=>{state.docs[Number(el.dataset.institution)].institution=e.target.value.trim();renderFiles()});
  }
  function wireStep1(){
    const cam=document.getElementById('cameraInput'), files=document.getElementById('filesInput');
    document.getElementById('cameraBtn').onclick=()=>cam.click(); document.getElementById('filesBtn').onclick=()=>files.click();
    cam.onchange=e=>addFiles(e.target.files); files.onchange=e=>addFiles(e.target.files);
    document.getElementById('scanBtn').onclick=scanAll;
    document.getElementById('statusBackBtn').onclick=()=>go(1);
    document.getElementById('nextBtn').onclick=()=>go(3);
  }
  function addFiles(list){
    [...(list||[])].forEach(file=>{
      if(!/^image\//.test(file.type)&&file.type!=='application/pdf')return;
      const preview=/^image\//.test(file.type)?URL.createObjectURL(file):'';
      state.docs.push({file,files:[file],preview,previews:preview?[preview]:[],type:'fz',amount:0,amountManual:false,status:'idle',confidence:0,institution:'',ocrText:'',personHints:{},identity:{}});
    });
    state.ocrStatus=''; renderStep2();
  }
  async function ensureWorker(){
    if(worker) return worker; if(!window.Tesseract) throw new Error('OCR-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.');
    worker=await window.Tesseract.createWorker('deu',1,{logger:m=>{ if(m?.status==='recognizing text'){state.ocrStatus=`Texterkennung … ${Math.round((m.progress||0)*100)}%`; const el=document.getElementById('scanStatus'); if(el)el.innerHTML=`<div class="info-strip">${esc(state.ocrStatus)}</div>`;} }}); return worker;
  }
  async function imageCanvas(file){
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const max=2400,scale=Math.min(1.7,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      // Mild grayscale/contrast cleanup improves photographed certificates without destroying thin text.
      const im=ctx.getImageData(0,0,canvas.width,canvas.height),data=im.data,contrast=1.22;
      for(let p=0;p<data.length;p+=4){
        const g=0.299*data[p]+0.587*data[p+1]+0.114*data[p+2];
        const v=Math.max(0,Math.min(255,(g-128)*contrast+128));
        data[p]=data[p+1]=data[p+2]=v;
      }
      ctx.putImageData(im,0,0); return canvas;
    } finally{URL.revokeObjectURL(url)}
  }
  function personalDataCanvas(source){
    const crop=document.createElement('canvas');
    // Upper document area: where Swiss certificates normally place name/address.
    const h=Math.max(1,Math.round(source.height*0.58));
    crop.width=source.width; crop.height=h;
    const ctx=crop.getContext('2d',{alpha:false});
    ctx.fillStyle='#fff';ctx.fillRect(0,0,crop.width,crop.height);
    ctx.drawImage(source,0,0,source.width,h,0,0,crop.width,h);
    return crop;
  }
  async function pdfCanvases(file){
    if(!window.pdfjsLib) throw new Error('PDF-Unterstützung konnte nicht geladen werden.'); window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const data=await file.arrayBuffer(), pdf=await window.pdfjsLib.getDocument({data}).promise, pages=[]; const max=Math.min(pdf.numPages,6);
    for(let n=1;n<=max;n++){const page=await pdf.getPage(n),vp=page.getViewport({scale:1.65}),c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;pages.push(c);} return pages;
  }
  async function scanAll(){
    if(!state.docs.length)return; state.scanning=true; state.ocrStatus='Alle Aufnahmen werden zuerst gelesen …'; renderStep2();
    try{
      const w=await ensureWorker();
      if(w.setParameters) await w.setParameters({preserve_interword_spaces:'1'});
      // Phase 1: OCR every uploaded image/PDF completely. No amounts are summed here.
      for(let i=0;i<state.docs.length;i++){
        const d=state.docs[i]; d.status='scanning'; state.ocrStatus=`Aufnahme ${i+1} von ${state.docs.length} wird gelesen …`; renderStep2();
        const files=d.files&&d.files.length?d.files:[d.file];
        let text='';
        for(let fi=0;fi<files.length;fi++){
          const file=files[fi],canvases=file.type==='application/pdf'?await pdfCanvases(file):[await imageCanvas(file)];
          for(let p=0;p<canvases.length;p++){
            state.ocrStatus=`Aufnahme ${i+1}, Seite ${p+1} wird gelesen …`;
            const r=await w.recognize(canvases[p]);
            text+='\n'+(r?.data?.text||'');
            // A focused second pass on the upper part greatly improves name/address
            // extraction on photographed certificates and screen photos.
            if(p===0){
              try{
                if(w.setParameters) await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
                const pr=await w.recognize(personalDataCanvas(canvases[p]));
                text+='\n'+(pr?.data?.text||'');
                if(w.setParameters) await w.setParameters({preserve_interword_spaces:'1'});
              }catch(_){}
            }
          }
        }
        d.ocrText=text;
        d.institution=extractInstitution(text)||d.institution;
        d.personHints=extractPersonHints(text);
        mergeHints(d.personHints);
        d.identity=extractDocumentIdentity(text);
        d.status='read';
      }
      // Phase 2: combine pages belonging to one certificate, then extract values once.
      state.ocrStatus='Zusammengehörige Seiten werden erkannt …';
      mergeRecognizedDocs();
      state.ocrStatus='';
    }catch(err){state.ocrStatus='Fehler: '+(err?.message||'Texterkennung fehlgeschlagen. Beträge können manuell eingetragen werden.');}
    finally{state.scanning=false; renderStep2();}
  }

  function renderStep3(){
    const p=state.person;
    const detectedCanton=cantonFromPostal(p.postalCode,p.city);
    if(detectedCanton&&!p.canton)p.canton=detectedCanton;
    surface.innerHTML=heading('👤',3,'Personalien prüfen','Bitte kontrollieren und ergänzen Sie die erkannten Angaben.')+`
      <div class="form-grid">
        <label><span>Vorname</span><input id="firstName" autocomplete="given-name" value="${esc(p.firstName)}"></label>
        <label><span>Nachname</span><input id="lastName" autocomplete="family-name" value="${esc(p.lastName)}"></label>
        <label class="full"><span>Strasse / Nr.</span><input id="street" autocomplete="street-address" value="${esc(p.street)}"></label>
        <label><span>PLZ</span><input id="postalCode" inputmode="numeric" maxlength="4" autocomplete="postal-code" value="${esc(p.postalCode)}"></label>
        <label><span>Ort</span><input id="city" autocomplete="address-level2" value="${esc(p.city)}"></label>
        <label class="full"><span>Kanton <small style="font-weight:600;color:#8a94a6">(aus PLZ)</small></span><select id="canton"><option value="">Bitte wählen</option>${Object.entries(CANTON_NAMES).map(([code,name])=>`<option value="${code}" ${p.canton===code?'selected':''}>${code} · ${name}</option>`).join('')}</select></label>
        <label><span>E-Mail</span><input id="email" type="email" autocomplete="email" value="${esc(p.email)}"></label>
        <label><span>Telefon</span><input id="phone" type="tel" autocomplete="tel" value="${esc(p.phone)}"></label>
        <label class="full"><span>Zivilstand</span><select id="maritalStatus"><option value="">Bitte wählen</option><option ${p.maritalStatus==='ledig'?'selected':''} value="ledig">Ledig / nicht in eingetragener Partnerschaft</option><option ${p.maritalStatus==='verheiratet'?'selected':''} value="verheiratet">Verheiratet / eingetragene Partnerschaft</option><option ${p.maritalStatus==='andere'?'selected':''} value="andere">Andere</option></select></label>
      </div>
      <div class="info-strip"><b>Erwerbssituation bereits geprüft:</b> ${esc(employmentLabel())}. Falls sich daran etwas ändert, gehen Sie über „Zurück“ bis zum ersten Schritt.</div>
      <div class="gate-card"><div class="radio-title">Pensionskasse erkannt</div><div class="section-copy">${state.docs.filter(d=>(d.type==='fz'||d.type==='other')&&d.institution).length?'Die passenden Formulare werden von Carlet Finance Coaching übernommen und für Sie vorbereitet.':'Falls eine Pensionskasse vorhanden ist, erfassen wir diese aus Ihren Unterlagen.'}</div></div>
      ${p.maritalStatus==='verheiratet'?'<div class="warning-strip">Bei Barauszahlungen aus der 2. Säule kann eine schriftliche Zustimmung des Ehegatten bzw. der eingetragenen Partnerperson erforderlich sein.</div>':''}
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Zurück</button><button class="btn primary" id="nextBtn">Guthaben berechnen →</button></div>`;
    const ids=['firstName','lastName','street','postalCode','city','canton','email','phone','maritalStatus']; ids.forEach(id=>document.getElementById(id).oninput=e=>{state.person[id]=e.target.value;if(id==='postalCode'||id==='city'){const code=cantonFromPostal(state.person.postalCode,state.person.city);if(code){state.person.canton=code;const sel=document.getElementById('canton');if(sel)sel.value=code}}if(id==='maritalStatus')renderStep3()});
    document.getElementById('backBtn').onclick=()=>go(2); document.getElementById('nextBtn').onclick=()=>{syncPerson(); const problem=validateStep3(); if(problem){alert(problem);return} go(4)};
  }
  function syncPerson(){['firstName','lastName','street','postalCode','city','canton','email','phone','maritalStatus'].forEach(id=>{const el=document.getElementById(id);if(el)state.person[id]=el.value})}
  function validateStep3(){const p=state.person;if(!p.firstName||!p.lastName||!p.street||!/^[1-9]\d{3}$/.test(p.postalCode)||!p.city||!p.canton||!/^\S+@\S+\.\S+$/.test(p.email)||!p.phone)return'Bitte alle Kontakt- und Adressfelder vollständig ausfüllen.';if(!p.maritalStatus)return'Bitte den Zivilstand auswählen.';return''}

  function totals(){const second=sum(state.docs.filter(d=>d.type==='fz'||d.type==='other').map(d=>d.amount)), third=sum(state.docs.filter(d=>d.type==='p3bank'||d.type==='p3insurance').map(d=>d.amount)), total=second+third, fee=total*CONFIG.feeRate,tax=total*CONFIG.taxReserveRate;return{second,third,total,fee,tax,afterFee:total-fee,planning:total-fee-tax}}
  function renderStep4(){const t=totals(); surface.innerHTML=heading('🧮',4,'Übersicht','')+`
      <div class="docs-summary">${state.docs.map((d,i)=>`<div class="docs-summary-row"><div><b>${docTypeLabel(d.type)}</b><small>${esc((d.institution?d.institution+' · ':'')+(((d.files&&d.files.length)||1)>1?((d.files&&d.files.length)||1)+' Bilder/Seiten':'1 Datei'))}</small></div><b>${money(d.amount)}</b></div>`).join('')}</div>
      <div class="summary-grid">
        <div class="summary-card"><small>2. Säule</small><b>${money(t.second)}</b></div>
        <div class="summary-card"><small>Säule 3a</small><b>${money(t.third)}</b></div>
        <div class="summary-card total"><small>Gesamt</small><b>${money(t.total)}</b></div>
        <div class="summary-card green"><small>Nach 4% Honorar</small><b>${money(t.afterFee)}</b></div>
      </div>
      <div class="breakdown">
        <div class="breakdown-row"><span>Honorar 4%</span><b>− ${money(t.fee)}</b></div>
        <div class="breakdown-row"><span>Steuerreserve ca. 6%</span><b>− ${money(t.tax)}</b></div>
        <div class="breakdown-row emphasis"><span>Voraussichtlich auf Ihrem Konto</span><b>${money(t.planning)}</b></div>
      </div>
      <div class="warning-strip">Die 6% Steuerreserve ist unverbindlich. Die tatsächliche Steuer kann abweichen.</div>
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Zurück</button><button class="btn primary" id="nextBtn">Weiter →</button></div>`;
    document.getElementById('backBtn').onclick=()=>go(3);
    document.getElementById('nextBtn').onclick=()=>go(5);
  }

  function leadText(){const t=totals(),p=state.person;return `CARLET FINANCE COACHING – VORSORGE-LEAD\n\nKunde: ${p.firstName} ${p.lastName}\nAdresse: ${p.street}, ${p.postalCode} ${p.city}\nE-Mail: ${p.email}\nTelefon: ${p.phone}\nZivilstand: ${p.maritalStatus}\nErwerbssituation: ${p.employmentStatus==='active'?'Ungekündigtes Arbeitsverhältnis':p.employmentStatus==='notice'?'Gekündigtes Arbeitsverhältnis / noch tätig':'Arbeitslos / nicht erwerbstätig'}\nAustrittsdatum: ${p.employmentEndDate||'-'}\nKanton: ${p.canton||'-'}\n\n${firstPillarSummaryText()}\n\nDokumente:\n${state.docs.map((d,i)=>`${i+1}. ${docTypeLabel(d.type)} – ${money(d.amount)} – ${d.institution||'Vorsorgeeinrichtung unbekannt'} – ${(d.files&&d.files.length)||1} Datei(en)/Seite(n)`).join('\n')}\n\n2. Säule/Freizügigkeit: ${money(t.second)}\nSäule 3a: ${money(t.third)}\nGesamt: ${money(t.total)}\nCarlet-Honorar 4%: ${money(t.fee)}\nSteuerreserve 6% (unverbindlich): ${money(t.tax)}\nVoraussichtlich auf Konto: ${money(t.planning)}\n\nKontaktwunsch: ${state.contactMethod}\nNotiz: ${state.note||'-'}\n\nINTERNE FORMULAR-LINKS:\n${internalFormLinksText()}`}
  function orderPayload(){
    const t=totals(),p=state.person;
    return {
      orderType:'Auszahlung Vorsorgegelder 2. und 3. Säule',
      acceptedAt:new Date().toISOString(),
      person:p,
      employmentStatus:p.employmentStatus,
      employmentEndDate:p.employmentEndDate||'',
      firstPillarOffice:firstPillarOffice(p.canton),
      firstPillarSummary:firstPillarSummaryText(),
      documents:state.docs.map(d=>({
        files:(d.files||[d.file]).filter(Boolean).map(f=>f.name),
        type:d.type,typeLabel:docTypeLabel(d.type),amount:d.amount,
        institution:d.institution||'',internalFormLinks:fundLinksFor(d.institution)
      })),
      totals:t,
      feeRate:CONFIG.feeRate,
      taxReserveRate:CONFIG.taxReserveRate,
      contactMethod:state.contactMethod,
      note:state.note,
      internalFormLinks:internalFormLinksText()
    };
  }
  function orderEmailText(){
    return 'AUFTRAG – CARLET FINANCE COACHING\n\n'+leadText()+
      '\n\nAUFTRAG DES KUNDEN:\nCarlet Finance Coaching wird beauftragt, die Auszahlung der erfassten Vorsorgegelder vorzubereiten und die erforderlichen Formulare und nächsten Schritte zu bearbeiten. Erforderliche Unterschriften oder Vollmachten werden separat eingeholt.'+
      '\n\nINTERN – 1. SÄULE / AHV:\n'+firstPillarSummaryText();
  }
  async function sendOrder(){
    const payload=orderPayload();
    if(CONFIG.leadEndpoint){
      const res=await fetch(CONFIG.leadEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!res.ok)throw new Error('Versand fehlgeschlagen');
      return 'sent';
    }
    if(CONFIG.advisorEmail){
      const subject='Neuer Vorsorge-Auftrag – '+state.person.firstName+' '+state.person.lastName;
      location.href='mailto:'+encodeURIComponent(CONFIG.advisorEmail)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(orderEmailText());
      return 'mailto';
    }
    throw new Error('Empfänger-E-Mail noch nicht hinterlegt');
  }

  function renderStep5(){const t=totals();surface.innerHTML=heading('✓',5,'Auftrag','')+`
      <div class="lead-card"><h3>${esc(state.person.firstName)} ${esc(state.person.lastName)} · ${money(t.planning)} voraussichtlich auf Ihrem Konto</h3></div>
      <label class="select-block"><span>Kontakt</span><select id="contactMethod"><option ${state.contactMethod==='Telefon'?'selected':''}>Telefon</option><option ${state.contactMethod==='E-Mail'?'selected':''}>E-Mail</option><option ${state.contactMethod==='WhatsApp'?'selected':''}>WhatsApp</option></select></label>
      <label class="select-block"><span>Notiz</span><textarea id="note" rows="3" placeholder="Optional">${esc(state.note)}</textarea></label>
      <label class="consent-card"><input id="orderAccepted" type="checkbox" ${state.orderAccepted?'checked':''}><span>Ich beauftrage Carlet Finance Coaching, die Auszahlung meiner erfassten Vorsorgegelder vorzubereiten und die erforderlichen Schritte für mich zu bearbeiten.</span></label>
      <button class="btn primary action-main" id="orderBtn" ${state.orderAccepted?'':'disabled'}>Auftrag erteilen</button>
      <div id="doneMsg"></div>
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Zurück</button><button class="btn soft" id="restartBtn">Neu</button></div>`;
    document.getElementById('contactMethod').onchange=e=>{state.contactMethod=e.target.value};
    document.getElementById('note').oninput=e=>{state.note=e.target.value};
    document.getElementById('orderAccepted').onchange=e=>{state.orderAccepted=e.target.checked;document.getElementById('orderBtn').disabled=!state.orderAccepted};
    document.getElementById('orderBtn').onclick=async()=>{
      const btn=document.getElementById('orderBtn'),msg=document.getElementById('doneMsg');
      btn.disabled=true;btn.textContent='Auftrag wird gesendet …';
      try{
        const mode=await sendOrder();
        msg.innerHTML='<div class="success-strip">✓ Auftrag vorbereitet'+(mode==='sent'?' und gesendet.':'. E-Mail-Programm wurde geöffnet.')+'</div>';
        btn.textContent='Auftrag erteilt';
      }catch(err){
        msg.innerHTML='<div class="error-strip">'+esc(err?.message||'Auftrag konnte nicht gesendet werden.')+'</div>';
        btn.disabled=!state.orderAccepted;btn.textContent='Auftrag erteilen';
      }
    };
    document.getElementById('backBtn').onclick=()=>go(4);document.getElementById('restartBtn').onclick=()=>location.reload();
  }

  render();
})();
</script>
