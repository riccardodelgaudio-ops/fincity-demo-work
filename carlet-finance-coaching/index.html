<body>
<main class="app-shell">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar"><div class="brand-lockup"><div class="brand-icon">CC</div><div><strong>Carlet Finance Coaching</strong><span>Vorsorgebezug · Schweiz</span></div></div></header>
  <section class="hero-card compact-hero">
    <div class="hero-message">Wir unterstützen Sie von A bis Z mit der Auszahlung Ihrer Vorsorgegelder der zweiten und dritten Säule.</div>
  </section>
  <nav class="progress-card" id="progress"></nav>
  <section class="surface" id="surface"></section>
  <footer>Carlet Finance Coaching · Beratungs-Prototyp · Daten bleiben in diesem Browser</footer>
</main>
<script>
(() => {
  const CONFIG = { feeRate: 0.04, taxReserveRate: 0.06, leadEndpoint: "", advisorEmail: "" };
  const PENSION_FUNDS = [
    {name:"BVK",keys:["bvk","beamtenversicherungskasse"],links:[["Formulare / Antrag Barauszahlung","https://bvk.ch/de/formulare"],["Information Austritt","https://bvk.ch/de/vorsorge/stellenwechsel-austritt"]]},
    {name:"Pensionskasse Stadt Zürich (PKZH)",keys:["pensionskasse stadt zürich","pkzh"],links:[["Austritt & Selbstständigkeit","https://www.pkzh.ch/de/fuer-berufstaetige/austritt.html"],["Merkblatt Barauszahlung","https://www.pkzh.ch/content/dam/stzh/pkzh/de/08_Kacheln/03_Fuer_Arbeitgebende/01_Stadt_Zuerich/01_Merkblaetter/MB-100_AKT_AN_Barauszahlung.pdf"]]},
    {name:"PUBLICA",keys:["publica"],links:[["Formulare & Merkblätter","https://www.publica.ch/de/meine-vorsorge/informationen/formulare-merkblaetter"],["Austritt","https://www.publica.ch/de/meine-vorsorge/lebensereignisse/austritt"]]},
    {name:"ASGA",keys:["asga"],links:[["Barauszahlung Selbstständigerwerbende","https://www.asga.ch/wp-content/uploads/downloads/formulare/formulare-d/barauszahlung_aufnahme_selbstaendigkeit_d.pdf"]]},
    {name:"AXA",keys:["axa","winterthur-columna","columna"],links:[["Austrittsmeldung / Barauszahlung","https://www.axa.ch/servlets/external/docstoredocument?accesscode=alnc9"]]},
    {name:"Allianz Suisse",keys:["allianz"],links:[["Antrag Auflösung Freizügigkeitspolice","https://www.allianz.ch/content/dam/onemarketing/azch/common/allianz/de/allianz-bvg-antrag_aufloesung_der_freizuegigkeitspolice.pdf"]]},
    {name:"Profond",keys:["profond"],links:[["Zahlungsangaben Austrittsleistung","https://www.profond.ch/sites/default/files/2025-07/Profond_Zahlungsangaben_Austrittsleistung_0.pdf"],["Merkblatt Selbstständigkeit","https://www.profond.ch/sites/default/files/2025-02/Profond_Merkblatt_Selbst%C3%A4ndigkeit.pdf"]]},
    {name:"Helvetia",keys:["helvetia"],links:[["Barauszahlung Austritts-/Freizügigkeitsleistung","https://www.helvetia.com/corp/wcf/servlets/blankopdf.html?afAcceptLang=de&form=%2Fcontent%2Fforms%2Faf%2Fwcf%2Fch%2Fforms-web%2Fcorporate-customer%2Ffzp%2Ffzp-redemption"]]},
    {name:"Pensionskasse Basel-Stadt (PKBS)",keys:["pensionskasse basel-stadt","pkbs"],links:[["Austritt & Barauszahlung","https://www.pkbs.ch/de/vorsorge/austritt/"]]}
  ];
  const steps = ["Status","Unterlagen","Daten","Prüfung","Anfrage"];
  const state = {
    step: 1, docs: [], consent: false, scanning: false, ocrStatus: "",
    person: { firstName:"", lastName:"", street:"", postalCode:"", city:"", email:"", phone:"", maritalStatus:"", employmentStatus:"", employmentEndDate:"", selfEmployed:"" },
    finalConsent: false, contactMethod:"Telefon", note:"", leadPrepared:false
  };
  const surface = document.getElementById("surface");
  const progress = document.getElementById("progress");
  let worker = null;
  const esc = v => String(v ?? "").replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
  const money = v => new Intl.NumberFormat("de-CH",{style:"currency",currency:"CHF",maximumFractionDigits:2}).format(Number(v)||0);
  const sum = arr => arr.reduce((a,b)=>a+(Number(b)||0),0);

  function renderProgress(){
    progress.innerHTML = steps.map((label,i)=>{const n=i+1, cls=n===state.step?'current':n<state.step?'done':''; return `<div class="progress-item ${cls}"><div>${n<state.step?'✓':n}</div><span>${label}</span></div>`}).join('');
  }
  function heading(icon,step,title,copy){return `<div class="section-heading"><div class="section-icon">${icon}</div><div><span>Schritt ${step}</span><h2>${title}</h2><p>${copy}</p></div></div>`}
  function go(step){state.step=Math.max(1,Math.min(5,step)); render(); window.scrollTo({top:0,behavior:'smooth'});}
  function docTypeLabel(t){return ({fz:'Freizügigkeit / 2. Säule',p3bank:'Säule 3a · Bank',p3insurance:'Säule 3a · Versicherung',other:'Anderes Vorsorgeguthaben'})[t]||'Noch prüfen'}
  function classify(text){const t=text.toLowerCase(); if(/säule\s*3a|3a-konto|vorsorgevereinbarung/.test(t)) return /(versicherung|police|rückkaufswert)/.test(t)?'p3insurance':'p3bank'; if(/freizügig|austrittsleistung|pensionskasse|berufliche vorsorge/.test(t)) return 'fz'; if(/vorsorge|police/.test(t)) return 'other'; return 'fz'}
  function parseAmount(raw){
    let s=String(raw||'').replace(/[’']/g,'').replace(/\s/g,'');
    if(s.includes(',')&&s.includes('.')){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
    else if(s.includes(',')) s=s.replace(',','.');
    else { const dots=(s.match(/\./g)||[]).length; if(dots>1 || (dots===1 && /\.\d{3}(?:\D|$)/.test(s))) s=s.replace(/\./g,''); }
    s=s.replace(/[^0-9.]/g,''); const n=Number(s); return Number.isFinite(n)?n:0;
  }
  function textLines(text){return String(text||'').split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean)}
  function extractAmount(text){
    const lines=textLines(text);
    const strong=[
      ['sparguthaben per',42],['aktuelles sparguthaben',38],['freizügigkeitsleistung',38],['austrittsleistung',38],
      ['vorsorgeguthaben',34],['kontoguthaben',32],['rückkaufswert',32],['policenwert',30],['altersguthaben',28],
      ['sparguthaben',24],['saldo',20],['guthaben',16],['stand per',12],['total',6]
    ];
    const negative=[
      ['voraussichtliche altersleistungen',-42],['pensionierung im alter',-38],['maximal möglicher einkauf',-34],
      ['maximaler einkauf',-34],['invalidität',-30],['invalidenrente',-30],['todesfall',-30],['ehegatten',-26],
      ['partnerschaftsrente',-26],['waisenrente',-26],['jahreslohn',-26],['versicherter lohn',-26],
      ['sparbeitrag',-22],['risikobeitrag',-22],['beiträge vom versicherten lohn',-24],['obligatorischer teil',-18],
      ['vorbezug',-10],['jahresbeitrag',-22],['prämie',-22],['monatlich',-18],['zins',-10],
      ['steuer',-20],['gebühr',-18],['iban',-18],['referenz',-18]
    ];
    const rx=/(?:CHF|Fr\.?|SFr\.?)?\s*(\d{1,3}(?:[ '\u2019.]\d{3})+(?:[.,]\d{1,2})?|\d{4,8}(?:[.,]\d{1,2})?)\s*(?:CHF|Fr\.?|SFr\.?|\.–|-)?/gi;
    let best={amount:0,score:-999,line:'',context:''};
    lines.forEach((line,idx)=>{
      const ctx=((lines[idx-2]||'')+' '+(lines[idx-1]||'')+' '+line+' '+(lines[idx+1]||'')).toLowerCase();
      let m; rx.lastIndex=0;
      while((m=rx.exec(line))){
        const amount=parseAmount(m[1]);
        if(amount<500 || (amount>=1900&&amount<=2100)) continue;
        let score=Math.log10(amount);
        strong.forEach(([k,w])=>{if(ctx.includes(k))score+=w});
        negative.forEach(([k,w])=>{if(ctx.includes(k))score+=w});
        // Exact current-balance rows are preferred over rounded planning/benefit values.
        if(/sparguthaben\s+per/i.test(line)) score+=30;
        if(/freizügigkeitsleistung|austrittsleistung/i.test(line)) score+=22;
        if(/maximal möglicher vorbezug/i.test(line)) score-=12;
        if(score>best.score) best={amount,score,line,context:ctx};
      }
    });
    return best;
  }
  function plausiblePersonName(line){
    const s=String(line||'').replace(/\s+/g,' ').trim();
    if(!s||s.length<4||s.length>60||/\d|@|www\.|versicherung|vorsorge|pensionskasse|strasse|straße|weg|platz|gasse|postfach|telefon|tel\b|policen|versicherten/i.test(s))return null;
    const parts=s.split(' ').filter(Boolean);
    if(parts.length<2||parts.length>5)return null;
    if(!parts.every(p=>/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’-]*$/.test(p)))return null;
    return {firstName:parts[0],lastName:parts.slice(1).join(' ')};
  }
  function extractPersonHints(text){
    const lines=textLines(text);
    let firstName='',lastName='',postalCode='',city='',street='';

      <div class="info-strip"><b>Erwerbssituation bereits geprüft:</b> ${esc(employmentLabel())}. Falls sich daran etwas ändert, gehen Sie über „Zurück“ bis zum ersten Schritt.</div>
      <div class="gate-card"><div class="radio-title">Selbstständigkeit als Bezugsgrund</div><div class="radio-card">
        <label class="radio-option"><input type="radio" name="selfEmployed" value="yes" ${p.selfEmployed==='yes'?'checked':''}><span><b>Ja, ich nehme eine selbstständige Erwerbstätigkeit auf / habe sie aufgenommen</b><small>Die definitive Anerkennung und Bezugsberechtigung wird separat geprüft.</small></span></label>
        <label class="radio-option"><input type="radio" name="selfEmployed" value="checking" ${p.selfEmployed==='checking'?'checked':''}><span><b>Ist noch in Abklärung</b><small>Eine Beratung ist möglich; eine Auszahlung kann erst nach erfüllten Voraussetzungen vorbereitet werden.</small></span></label>
        <label class="radio-option"><input type="radio" name="selfEmployed" value="no" ${p.selfEmployed==='no'?'checked':''}><span><b>Nein</b><small>Dann passt dieser Bezugsprozess aktuell nicht.</small></span></label>
      </div></div>
      <div class="gate-card"><div class="radio-title">Pensionskasse erkannt</div><div class="section-copy">${state.docs.filter(d=>(d.type==='fz'||d.type==='other')&&d.institution).length?'Die passenden Formulare werden von Carlet Finance Coaching übernommen und für Sie vorbereitet.':'Falls eine Pensionskasse vorhanden ist, erfassen wir diese aus Ihren Unterlagen.'}</div></div>
      <div id="gateMessage"></div>
      ${p.maritalStatus==='verheiratet'?'<div class="warning-strip">Bei Barauszahlungen aus der 2. Säule kann eine schriftliche Zustimmung des Ehegatten bzw. der eingetragenen Partnerperson erforderlich sein.</div>':''}
      <div class="info-strip"><b>Wichtig:</b> Ein gekündigtes Arbeitsverhältnis ist für die Beratung bereits relevant. Eine Barauszahlung wegen Selbstständigkeit setzt jedoch voraus, dass die obligatorische berufliche Vorsorge nicht mehr besteht und die Selbstständigkeit von den zuständigen Stellen anerkannt bzw. nachgewiesen wird.</div>
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Zurück</button><button class="btn primary" id="nextBtn">Guthaben berechnen →</button></div>`;
    const ids=['firstName','lastName','street','postalCode','city','email','phone','maritalStatus']; ids.forEach(id=>document.getElementById(id).oninput=e=>{state.person[id]=e.target.value;if(id==='maritalStatus')renderStep3()});
    document.querySelectorAll('input[name=selfEmployed]').forEach(r=>r.onchange=e=>{state.person.selfEmployed=e.target.value;updateGate()});
    document.getElementById('backBtn').onclick=()=>go(2); document.getElementById('nextBtn').onclick=()=>{syncPerson(); const problem=validateStep3(); if(problem){document.getElementById('gateMessage').innerHTML=`<div class="error-strip">${esc(problem)}</div>`;return} go(4)}; updateGate();
  }
  function syncPerson(){['firstName','lastName','street','postalCode','city','email','phone','maritalStatus'].forEach(id=>{const el=document.getElementById(id);if(el)state.person[id]=el.value})}
  function validateStep3(){const p=state.person;if(!p.firstName||!p.lastName||!p.street||!/^[1-9]\d{3}$/.test(p.postalCode)||!p.city||!/^\S+@\S+\.\S+$/.test(p.email)||!p.phone)return'Bitte alle Kontakt- und Adressfelder vollständig ausfüllen.';if(!p.maritalStatus)return'Bitte den Zivilstand auswählen.';if(p.selfEmployed==='no')return'Ohne Aufnahme einer selbstständigen Erwerbstätigkeit kann dieser Bezugsweg hier nicht weitergeführt werden.';if(!p.selfEmployed)return'Bitte den Stand Ihrer Selbstständigkeit angeben.';return''}
  function updateGate(){const el=document.getElementById('gateMessage');if(!el)return; if(state.person.selfEmployed==='no')el.innerHTML='<div class="error-strip">Stopp: Dieser Prozess ist auf einen möglichen Bezug im Zusammenhang mit der Aufnahme einer Selbstständigkeit ausgerichtet.</div>'; else if(state.person.selfEmployed==='checking')el.innerHTML='<div class="warning-strip">Beratung möglich: Die Selbstständigkeit muss vor einer Auszahlung rechtlich und administrativ geklärt bzw. anerkannt sein.</div>'; else if(state.person.selfEmployed==='yes')el.innerHTML='<div class="success-strip">✓ Selbstständigkeit als Bezugsgrund angegeben. Die definitive Anerkennung und Auszahlung wird separat geprüft.</div>'; else el.innerHTML=''}

  function totals(){const second=sum(state.docs.filter(d=>d.type==='fz'||d.type==='other').map(d=>d.amount)), third=sum(state.docs.filter(d=>d.type==='p3bank'||d.type==='p3insurance').map(d=>d.amount)), total=second+third, fee=total*CONFIG.feeRate,tax=total*CONFIG.taxReserveRate;return{second,third,total,fee,tax,afterFee:total-fee,planning:total-fee-tax}}
  function renderStep4(){const t=totals(); surface.innerHTML=heading('🧮',4,'Guthaben & Kostenübersicht','Alle erfassten Freizügigkeits- und Säule-3a-Guthaben werden zusammengerechnet. Bitte die Werte vor der Anfrage nochmals prüfen.')+`
      <div class="docs-summary">${state.docs.map((d,i)=>`<div class="docs-summary-row"><div><b>${docTypeLabel(d.type)}</b><small>${esc((d.institution?d.institution+' · ':'')+(((d.files&&d.files.length)||1)>1?((d.files&&d.files.length)||1)+' Bilder/Seiten':'1 Datei'))}</small></div><b>${money(d.amount)}</b></div>`).join('')}</div>
      <div class="summary-grid"><div class="summary-card"><small>2. Säule / Freizügigkeit</small><b>${money(t.second)}</b><span>erfasste Guthaben</span></div><div class="summary-card"><small>Säule 3a</small><b>${money(t.third)}</b><span>Bank &amp; Versicherung</span></div><div class="summary-card total"><small>Gesamtes erfasstes Guthaben</small><b>${money(t.total)}</b><span>vor Honorar und Steuern</span></div><div class="summary-card green"><small>Nach 4% Carlet-Honorar</small><b>${money(t.afterFee)}</b><span>Steuern noch nicht berücksichtigt</span></div></div>
      <div class="breakdown"><div class="breakdown-row"><span>Carlet Finance Coaching · Honorar 4%</span><b>− ${money(t.fee)}</b></div><div class="breakdown-row"><span>Unverbindliche Steuerreserve ca. 6%</span><b>− ${money(t.tax)}</b></div><div class="breakdown-row emphasis"><span>Planungsbetrag nach Honorar + 6%-Reserve</span><b>${money(t.planning)}</b></div></div>
      <div class="warning-strip"><b>Steuerhinweis:</b> Die 6% sind nur eine Planungsannahme. Die tatsächliche Kapitalleistungssteuer ist separat geschuldet und hängt unter anderem von Wohnort, Betrag, Zivilstand und Auszahlungszeitpunkt ab. Sie ist nicht Bestandteil des 4%-Honorars.</div>
      <div class="info-strip"><b>Bezugsprüfung:</b> Die dargestellten Guthaben sind keine Auszahlungszusage. Freizügigkeits- und Säule-3a-Bezüge werden von den jeweiligen Einrichtungen anhand der gesetzlichen Voraussetzungen und Nachweise geprüft.</div>
      <label class="consent-card"><input id="finalConsent" type="checkbox" ${state.finalConsent?'checked':''}><span>Ich habe die erfassten Guthaben kontrolliert und verstanden, dass Steuer und Bezugsberechtigung erst definitiv geprüft werden.</span></label>
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Daten ändern</button><button class="btn primary" id="nextBtn" ${state.finalConsent?'':'disabled'}>Beratung anfragen →</button></div>`;
    document.getElementById('finalConsent').onchange=e=>{state.finalConsent=e.target.checked;document.getElementById('nextBtn').disabled=!state.finalConsent}; document.getElementById('backBtn').onclick=()=>go(3);document.getElementById('nextBtn').onclick=()=>go(5);
  }

  function leadText(){const t=totals(),p=state.person;return `CARLET FINANCE COACHING – VORSORGE-LEAD\n\nKunde: ${p.firstName} ${p.lastName}\nAdresse: ${p.street}, ${p.postalCode} ${p.city}\nE-Mail: ${p.email}\nTelefon: ${p.phone}\nZivilstand: ${p.maritalStatus}\nErwerbssituation: ${p.employmentStatus==='active'?'Ungekündigtes Arbeitsverhältnis':p.employmentStatus==='notice'?'Gekündigtes Arbeitsverhältnis / noch tätig':'Arbeitslos / nicht erwerbstätig'}\nAustrittsdatum: ${p.employmentEndDate||'-'}\nSelbstständigkeit: ${p.selfEmployed}\n\nDokumente:\n${state.docs.map((d,i)=>`${i+1}. ${docTypeLabel(d.type)} – ${money(d.amount)} – ${d.institution||'Vorsorgeeinrichtung unbekannt'} – ${(d.files&&d.files.length)||1} Datei(en)/Seite(n)`).join('\n')}\n\n2. Säule/Freizügigkeit: ${money(t.second)}\nSäule 3a: ${money(t.third)}\nGesamt: ${money(t.total)}\nCarlet-Honorar 4%: ${money(t.fee)}\nSteuerreserve 6% (unverbindlich): ${money(t.tax)}\nPlanungsbetrag: ${money(t.planning)}\n\nKontaktwunsch: ${state.contactMethod}\nNotiz: ${state.note||'-'}\n\nINTERNE FORMULAR-LINKS:\n${internalFormLinksText()}`}
  function renderStep5(){const t=totals();surface.innerHTML=heading('✓',5,'Anfrage','')+`
      <div class="lead-card"><h3>${esc(state.person.firstName)} ${esc(state.person.lastName)} · ${money(t.total)}</h3></div>
      <label class="select-block"><span>Kontakt</span><select id="contactMethod"><option ${state.contactMethod==='Telefon'?'selected':''}>Telefon</option><option ${state.contactMethod==='E-Mail'?'selected':''}>E-Mail</option><option ${state.contactMethod==='WhatsApp'?'selected':''}>WhatsApp</option></select></label>
      <label class="select-block"><span>Notiz</span><textarea id="note" rows="3" placeholder="Optional">${esc(state.note)}</textarea></label>
      <button class="btn primary action-main" id="copyBtn">Anfrage kopieren</button>
      <button class="btn soft action-main" id="downloadBtn">JSON exportieren</button>
      <div id="doneMsg"></div>
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Zurück</button><button class="btn soft" id="restartBtn">Neu starten</button></div>`;
    document.getElementById('contactMethod').onchange=e=>{state.contactMethod=e.target.value};
    document.getElementById('note').oninput=e=>{state.note=e.target.value};
    document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(leadText());document.getElementById('doneMsg').innerHTML='<div class="success-strip">✓ Kopiert</div>'}catch{document.getElementById('doneMsg').innerHTML='<div class="error-strip">Kopieren nicht möglich.</div>'}};
    document.getElementById('downloadBtn').onclick=()=>{const payload={createdAt:new Date().toISOString(),person:state.person,documents:state.docs.map(d=>({name:d.file?.name||"",files:(d.files||[d.file]).filter(Boolean).map(f=>f.name),type:d.type,typeLabel:docTypeLabel(d.type),amount:d.amount,institution:d.institution||"",internalFormLinks:fundLinksFor(d.institution)})),totals:totals(),internalFormLinks:internalFormLinksText(),feeRate:CONFIG.feeRate,taxReserveRate:CONFIG.taxReserveRate,contactMethod:state.contactMethod,note:state.note};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`carlet-lead-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
    document.getElementById('backBtn').onclick=()=>go(4);document.getElementById('restartBtn').onclick=()=>location.reload();
  }

  render();
})();
</script>
</body>
