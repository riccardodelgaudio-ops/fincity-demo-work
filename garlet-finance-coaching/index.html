y .18s,box-shadow .18s}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 12px 25px #3157d538}.btn.soft{color:#334155;background:#eef2f8}.btn.danger{color:#9b2c2c;background:#fff0f0}.btn.xl{width:min(100%,390px);margin:8px auto;display:block}.action-main{width:100%;margin-top:14px;padding:16px;font-size:15px}.files-grid{gap:10px;margin-top:14px;display:grid}.file-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px}.file-top{display:grid;grid-template-columns:56px 1fr auto;gap:11px;align-items:center}.thumb{object-fit:cover;background:#eef2f6;border-radius:14px;width:56px;height:56px}.thumb.pdf{color:#3356c7;place-items:center;font-weight:900;display:grid}.file-meta strong,.file-meta span,.file-meta small{display:block}.file-meta span{color:#344054;text-overflow:ellipsis;margin-top:2px;font-size:12px;overflow:hidden}.file-meta small{color:#98a2b3;margin-top:3px;font-size:10px}.icon-button{color:#526176;background:#f0f3f8;border:0;border-radius:12px;width:36px;height:36px;font-size:21px}.doc-fields{grid-template-columns:1.2fr .9fr;gap:10px;margin-top:12px;display:grid}.doc-fields label>span,.form-grid label>span,.select-block>span,.radio-title{color:#475467;margin:0 0 6px 2px;font-size:11px;font-weight:850;display:block}.doc-fields input,.doc-fields select,.form-grid input,.form-grid select,.select-block select,textarea{color:#1d2939;background:#fbfcfe;border:1px solid #d7dfeb;border-radius:14px;outline:none;width:100%;padding:12px 13px}.doc-fields input:focus,.doc-fields select:focus,.form-grid input:focus,.form-grid select:focus,.select-block select:focus,textarea:focus{border-color:#7892ed;box-shadow:0 0 0 3px #e9efff}.amount-field{position:relative}.amount-field:before{content:"CHF";position:absolute;left:13px;top:36px;color:#667085;font-size:12px;font-weight:800}.amount-field input{padding-left:48px}.success-strip,.info-strip,.error-strip,.warning-strip{border-radius:18px;margin-top:14px;padding:14px 15px}.success-strip{color:#08664b;background:#e7f8f1;align-items:center;gap:10px;display:flex}.info-strip{color:#36529c;background:#edf3ff;font-size:13px;line-height:1.45}.error-strip{color:#a02828;background:#fff0f0;font-size:13px;line-height:1.45}.warning-strip{color:#8a4b13;background:#fff6e8;font-size:13px;line-height:1.5}.consent-card{color:#344054;background:#f4f7fb;border:1px solid #e8edf4;border-radius:18px;align-items:flex-start;gap:11px;margin-top:14px;padding:15px;font-size:13px;line-height:1.5;display:flex}.consent-card input{width:19px;height:19px;accent-color:var(--blue);flex:none;margin-top:1px}.microcopy{text-align:center;color:#95a0b1;margin:12px 0 0;font-size:10px}.form-grid{grid-template-columns:1fr 1fr;gap:11px;display:grid}.form-grid .full{grid-column:1/-1}.select-block{margin-top:14px;display:block}.radio-card{display:grid;gap:8px;margin-top:6px}.radio-option{background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;align-items:flex-start;gap:10px;padding:12px 13px;cursor:pointer}.radio-option input{accent-color:var(--blue);width:18px;height:18px;margin-top:1px;flex:none}.radio-option b{font-size:13px;display:block}.radio-option small{display:block;color:#718096;margin-top:2px;line-height:1.4}.gate-card{border:1px solid #dce5f2;background:#f8faff;border-radius:20px;margin-top:15px;padding:16px}.gate-card+.gate-card{margin-top:11px}.footer-actions{justify-content:space-between;gap:10px;margin-top:18px;display:flex}.footer-actions .btn{min-width:130px}.summary-grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;display:grid}.summary-card{background:#f7f9fd;border:1px solid #e0e7f1;border-radius:18px;padding:15px}.summary-card small,.summary-card b,.summary-card span{display:block}.summary-card small{text-transform:uppercase;letter-spacing:.07em;color:#718096;font-size:9px;font-weight:900}.summary-card b{font-size:21px;margin-top:3px;letter-spacing:-.02em}.summary-card span{color:#667085;font-size:10px;margin-top:2px}.summary-card.total{color:#fff;background:linear-gradient(135deg,#183765,#3157d5);border:0}.summary-card.total small,.summary-card.total span{color:#dbe6ff}.summary-card.green{background:linear-gradient(135deg,#e5f8ef,#f2fbf7);border-color:#d3efe3;color:#08684d}.breakdown{margin-top:16px;display:grid;gap:8px}.breakdown-row{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.breakdown-row span{color:#667085;font-size:12px}.breakdown-row b{text-align:right;font-size:13px}.breakdown-row.emphasis{background:#f1f5ff;border-color:#dbe5ff}.docs-summary{margin-top:14px;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff}.docs-summary-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;align-items:center}.docs-summary-row+.docs-summary-row{border-top:1px solid #edf1f6}.docs-summary-row small{display:block;color:#8a96a8;margin-top:2px}.docs-summary-row b:last-child{text-align:right}.lead-card{background:linear-gradient(145deg,#f4f7ff,#fff);border:1px solid #dce6fb;border-radius:22px;padding:18px;margin-top:14px}.lead-card h3{margin:0 0 6px;font-size:18px}.lead-card p{color:#667085;font-size:12px;line-height:1.55;margin:0}.code-box{white-space:pre-wrap;background:#111827;color:#e5e7eb;border-radius:16px;padding:14px;margin-top:12px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:260px;overflow:auto}.hidden{display:none!important}footer{text-align:center;color:#77849a;padding:24px 0 0;font-size:10px}@media(max-width:620px){.app-shell{padding:14px 12px 60px}.hero-card{padding:22px}.hero-card h1{font-size:36px}.hero-speedline{font-size:12px}.progress-item{gap:4px}.progress-item span{font-size:9px}.surface{padding:20px 17px}.section-heading h2{font-size:24px}.form-grid,.doc-fields,.summary-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.footer-actions{flex-direction:column-reverse}.footer-actions .btn{width:100%}.file-top{grid-template-columns:50px 1fr auto}.thumb{width:50px;height:50px}}

<body>
<main class="app-shell">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar"><div class="brand-lockup"><div class="brand-icon">CC</div><div><strong>Carlet Finance Coaching</strong><span>Vorsorgebezug · Schweiz</span></div></div></header>
  <section class="hero-card">
    <div class="eyebrow">VORSORGEGUTHABEN PRÜFEN</div>
    <div class="hero-speedline">Freizügigkeit &amp; Säule 3a erfassen, Voraussetzungen prüfen und Bezug vorbereiten.</div>
    <h1>Foto. Prüfen.<br><span>Bezug vorbereiten.</span></h1>
  </section>
  <nav class="progress-card" id="progress"></nav>
  <section class="surface" id="surface"></section>
  <footer>Carlet Finance Coaching · Beratungs-Prototyp · Daten bleiben in diesem Browser</footer>
</main>
<script>
(() => {
  const CONFIG = { feeRate: 0.04, taxReserveRate: 0.06, leadEndpoint: "", advisorEmail: "" };
  const steps = ["Unterlagen","Daten","Prüfung","Anfrage"];
  const state = {
    step: 1, docs: [], consent: false, scanning: false, ocrStatus: "",
    person: { firstName:"", lastName:"", street:"", postalCode:"", city:"", email:"", phone:"", maritalStatus:"", employmentStatus:"", employmentEndDate:"", selfEmployed:"" },
    finalConsent: false, contactMethod:"Telefon", note:"", leadPrepared:false
  };
  const surface = document.getElementById("surface");
  const progress = document.getElementById("progress");
  let worker = null;
  const esc = v => String(v ?? "").replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
  const money = v => new Intl.NumberFormat("de-CH",{style:"currency",currency:"CHF",maximumFractionDigits:2}).format(Number(v)||0);
  const sum = arr => arr.reduce((a,b)=>a+(Number(b)||0),0);

  function renderProgress(){
    progress.innerHTML = steps.map((label,i)=>{const n=i+1, cls=n===state.step?'current':n<state.step?'done':''; return `<div class="progress-item ${cls}"><div>${n<state.step?'✓':n}</div><span>${label}</span></div>`}).join('');
  }
  function heading(icon,step,title,copy){return `<div class="section-heading"><div class="section-icon">${icon}</div><div><span>Schritt ${step}</span><h2>${title}</h2><p>${copy}</p></div></div>`}
  function go(step){state.step=Math.max(1,Math.min(4,step)); render(); window.scrollTo({top:0,behavior:'smooth'});}
  function docTypeLabel(t){return ({fz:'Freizügigkeit / 2. Säule',p3bank:'Säule 3a · Bank',p3insurance:'Säule 3a · Versicherung',other:'Anderes Vorsorgeguthaben'})[t]||'Noch prüfen'}
  function classify(text){const t=text.toLowerCase(); if(/säule\s*3a|3a-konto|vorsorgevereinbarung/.test(t)) return /(versicherung|police|rückkaufswert)/.test(t)?'p3insurance':'p3bank'; if(/freizügig|austrittsleistung|pensionskasse|berufliche vorsorge/.test(t)) return 'fz'; if(/vorsorge|police/.test(t)) return 'other'; return 'fz'}
  function parseAmount(raw){
    let s=String(raw||'').replace(/[’']/g,'').replace(/\s/g,'');
    if(s.includes(',')&&s.includes('.')){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
    else if(s.includes(',')) s=s.replace(',','.');
    else { const dots=(s.match(/\./g)||[]).length; if(dots>1 || (dots===1 && /\.\d{3}(?:\D|$)/.test(s))) s=s.replace(/\./g,''); }
    s=s.replace(/[^0-9.]/g,''); const n=Number(s); return Number.isFinite(n)?n:0;
  }
  function extractAmount(text){
    const lines=String(text||'').split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
    const positive=[['gesamt',9],['guthaben',8],['freizügigkeitsleistung',10],['austrittsleistung',10],['vorsorgeguthaben',10],['kontoguthaben',9],['saldo',7],['rückkaufswert',9],['policenwert',8],['kapital',5],['stand per',4],['total',6]];
    const negative=['jahresbeitrag','prämie','monatlich','zins','steuern','steuer','rente pro','gebühr','iban','referenz'];
    const rx=/(?:CHF|Fr\.?|SFr\.?)?\s*(\d{1,3}(?:[ '\u2019.]\d{3})+(?:[.,]\d{1,2})?|\d{4,8}(?:[.,]\d{1,2})?)\s*(?:CHF|Fr\.?|SFr\.?|\.–|-)?/gi;
    let best={amount:0,score:-99,line:''};
    lines.forEach((line,idx)=>{
      const ctx=((lines[idx-1]||'')+' '+line+' '+(lines[idx+1]||'')).toLowerCase();
      let m; rx.lastIndex=0;
      while((m=rx.exec(line))){ const amount=parseAmount(m[1]); if(amount<500 || (amount>=1900&&amount<=2100)) continue; let score=Math.log10(amount); positive.forEach(([k,w])=>{if(ctx.includes(k))score+=w}); negative.forEach(k=>{if(ctx.includes(k))score-=8}); if(score>best.score) best={amount,score,line}; }
    });
    return best;
  }
  function extractPersonHints(text){
    const lines=String(text||'').split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
    let postalCode='',city='',street='';
    for(let i=0;i<lines.length;i++){
      const m=lines[i].match(/\b([1-9]\d{3})\s+([A-Za-zÄÖÜäöüÀ-ÿ][A-Za-zÄÖÜäöüÀ-ÿ .'-]{2,45})$/);
      if(m){postalCode=m[1];city=m[2].trim(); const prev=lines[i-1]||''; if(/\d/.test(prev)&&prev.length<70) street=prev; break;}
    }
    return {postalCode,city,street};
  }
  function mergeHints(h){ ['postalCode','city','street'].forEach(k=>{if(!state.person[k]&&h[k]) state.person[k]=h[k]}) }

  function render(){renderProgress(); if(state.step===1) renderStep1(); if(state.step===2) renderStep2(); if(state.step===3) renderStep3(); if(state.step===4) renderStep4();}

  function renderStep1(){
    surface.innerHTML = heading('📄',1,'Vorsorgeunterlagen erfassen','Fotografieren oder wählen Sie Freizügigkeitspolicen, Kontoauszüge und Säule-3a-Unterlagen. Mehrere Dokumente sind möglich.') + `
      <div class="upload-zone"><div class="upload-visual">📷</div><h3>Unterlagen hinzufügen</h3><p>Gut lesbar, vollständig und möglichst ohne Spiegelungen.</p>
        <button class="btn primary xl" id="cameraBtn">Foto aufnehmen</button><input hidden id="cameraInput" type="file" accept="image/*" capture="environment">
        <button class="btn soft xl" id="filesBtn">Bilder oder PDF wählen</button><input hidden id="filesInput" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf">
        <small>Bilder oder PDF · mehrere Policen/Konten möglich · PDF bis 6 Seiten je Dokument</small></div>
      <div class="files-grid" id="filesGrid"></div>
      <div class="info-strip">🔒 Die Texterkennung läuft im Browser. Dokumentbilder werden von dieser Seite nicht an Carlet Finance Coaching übertragen.</div>
      <label class="consent-card"><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>Ich stimme der lokalen Texterkennung zu und prüfe die automatisch erkannten Beträge vor dem Weiterfahren.</span></label>
      <div id="scanStatus">${state.ocrStatus?`<div class="${state.ocrStatus.startsWith('Fehler')?'error-strip':'info-strip'}">${esc(state.ocrStatus)}</div>`:''}</div>
      <button class="btn primary action-main" id="scanBtn" ${state.scanning||!state.docs.length||!state.consent?'disabled':''}>${state.scanning?'Dokumente werden gelesen …':'Dokumente auslesen & prüfen'}</button>
      <button class="btn soft action-main" id="nextBtn" ${state.docs.length && state.docs.every(d=>Number(d.amount)>0)?'':'disabled'}>Weiter zu den Daten →</button>
      <p class="microcopy">Automatische Erkennung kann Fehler enthalten. Massgebend sind die Originalunterlagen und die Prüfung durch die jeweilige Vorsorgeeinrichtung.</p>`;
    wireStep1(); renderFiles();
  }
  function renderFiles(){
    const grid=document.getElementById('filesGrid'); if(!grid) return;
    grid.innerHTML=state.docs.map((d,i)=>`<div class="file-card" data-i="${i}"><div class="file-top">
      ${d.preview?`<img class="thumb" src="${d.preview}" alt="Dokument ${i+1}">`:`<div class="thumb pdf">PDF</div>`}
      <div class="file-meta"><strong>Dokument ${i+1}</strong><span>${esc(d.file.name)}</span><small>${d.status==='done'?'✓ erkannt':d.status==='scanning'?'wird gelesen …':'noch nicht gelesen'}${d.confidence?` · Treffer ${Math.round(Math.min(99,d.confidence*6))}%`:''}</small></div>
      <button class="icon-button" data-remove="${i}" aria-label="Dokument entfernen">×</button></div>
      <div class="doc-fields"><label><span>Dokumentart</span><select data-type="${i}"><option value="fz" ${d.type==='fz'?'selected':''}>Freizügigkeit / 2. Säule</option><option value="p3bank" ${d.type==='p3bank'?'selected':''}>Säule 3a · Bank</option><option value="p3insurance" ${d.type==='p3insurance'?'selected':''}>Säule 3a · Versicherung</option><option value="other" ${d.type==='other'?'selected':''}>Anderes Vorsorgeguthaben</option></select></label>
      <label class="amount-field"><span>Erkanntes Guthaben</span><input inputmode="decimal" data-amount="${i}" value="${d.amount?esc(String(d.amount)):''}" placeholder="0.00"></label></div>
    </div>`).join('');
    grid.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.remove); const d=state.docs[i]; if(d?.preview&&d.preview.startsWith('blob:')) URL.revokeObjectURL(d.preview); state.docs.splice(i,1); renderStep1();});
    grid.querySelectorAll('[data-type]').forEach(el=>el.onchange=e=>state.docs[Number(el.dataset.type)].type=e.target.value);
    grid.querySelectorAll('[data-amount]').forEach(el=>el.oninput=e=>{state.docs[Number(el.dataset.amount)].amount=parseAmount(e.target.value); document.getElementById('nextBtn').disabled=!state.docs.length||!state.docs.every(d=>Number(d.amount)>0)});
  }
  function wireStep1(){
    const cam=document.getElementById('cameraInput'), files=document.getElementById('filesInput');
    document.getElementById('cameraBtn').onclick=()=>cam.click(); document.getElementById('filesBtn').onclick=()=>files.click();
    cam.onchange=e=>addFiles(e.target.files); files.onchange=e=>addFiles(e.target.files);
    document.getElementById('consent').onchange=e=>{state.consent=e.target.checked; document.getElementById('scanBtn').disabled=state.scanning||!state.docs.length||!state.consent};
    document.getElementById('scanBtn').onclick=scanAll;
    document.getElementById('nextBtn').onclick=()=>go(2);
  }
  function addFiles(list){
    [...(list||[])].forEach(file=>{if(!/^image\//.test(file.type)&&file.type!=='application/pdf')return; state.docs.push({file,preview:/^image\//.test(file.type)?URL.createObjectURL(file):'',type:'fz',amount:0,status:'idle',confidence:0});}); state.ocrStatus=''; renderStep1();
  }
  async function ensureWorker(){
    if(worker) return worker; if(!window.Tesseract) throw new Error('OCR-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.');
    worker=await window.Tesseract.createWorker('deu',1,{logger:m=>{ if(m?.status==='recognizing text'){state.ocrStatus=`Texterkennung … ${Math.round((m.progress||0)*100)}%`; const el=document.getElementById('scanStatus'); if(el)el.innerHTML=`<div class="info-strip">${esc(state.ocrStatus)}</div>`;} }}); return worker;
  }
  async function imageCanvas(file){
    const url=URL.createObjectURL(file); try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url}); const max=1900,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c;} finally{URL.revokeObjectURL(url)}
  }
  async function pdfCanvases(file){
    if(!window.pdfjsLib) throw new Error('PDF-Unterstützung konnte nicht geladen werden.'); window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const data=await file.arrayBuffer(), pdf=await window.pdfjsLib.getDocument({data}).promise, pages=[]; const max=Math.min(pdf.numPages,6);
    for(let n=1;n<=max;n++){const page=await pdf.getPage(n),vp=page.getViewport({scale:1.65}),c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;pages.push(c);} return pages;
  }
  async function scanAll(){
    if(!state.consent||!state.docs.length)return; state.scanning=true; state.ocrStatus='Texterkennung wird vorbereitet …'; renderStep1();
    try{
      const w=await ensureWorker();
      for(let i=0;i<state.docs.length;i++){
        const d=state.docs[i]; if(d.status==='done'&&d.amount>0) continue; d.status='scanning'; state.ocrStatus=`Dokument ${i+1} von ${state.docs.length} wird gelesen …`; renderStep1();
        const canvases=d.file.type==='application/pdf'?await pdfCanvases(d.file):[await imageCanvas(d.file)]; let text='';
        for(let p=0;p<canvases.length;p++){state.ocrStatus=`Dokument ${i+1}, Seite ${p+1} wird gelesen …`; const r=await w.recognize(canvases[p]); text+='\n'+(r?.data?.text||'');}
        const hit=extractAmount(text); d.amount=hit.amount||d.amount; d.confidence=hit.score; d.type=classify(text); d.status='done'; mergeHints(extractPersonHints(text));
      }
      state.ocrStatus='Erkennung abgeschlossen. Bitte Dokumentart und Guthaben je Dokument kontrollieren.';
    }catch(err){state.ocrStatus='Fehler: '+(err?.message||'Texterkennung fehlgeschlagen. Beträge können manuell eingetragen werden.');}
    finally{state.scanning=false; renderStep1();}
  }

  function renderStep2(){
    const p=state.person; surface.innerHTML=heading('👤',2,'Daten & Voraussetzungen prüfen','Bitte kontrollieren Sie die Kontaktdaten. Danach prüfen wir die grundlegenden Voraussetzungen für einen Bezug im Zusammenhang mit Selbstständigkeit.')+`
      <div class="form-grid">
        <label><span>Vorname</span><input id="firstName" autocomplete="given-name" value="${esc(p.firstName)}"></label>
        <label><span>Nachname</span><input id="lastName" autocomplete="family-name" value="${esc(p.lastName)}"></label>
        <label class="full"><span>Strasse / Nr.</span><input id="street" autocomplete="street-address" value="${esc(p.street)}"></label>
        <label><span>PLZ</span><input id="postalCode" inputmode="numeric" maxlength="4" autocomplete="postal-code" value="${esc(p.postalCode)}"></label>
        <label><span>Ort</span><input id="city" autocomplete="address-level2" value="${esc(p.city)}"></label>
        <label><span>E-Mail</span><input id="email" type="email" autocomplete="email" value="${esc(p.email)}"></label>
        <label><span>Telefon</span><input id="phone" type="tel" autocomplete="tel" value="${esc(p.phone)}"></label>
        <label class="full"><span>Zivilstand</span><select id="maritalStatus"><option value="">Bitte wählen</option><option ${p.maritalStatus==='ledig'?'selected':''} value="ledig">Ledig / nicht in eingetragener Partnerschaft</option><option ${p.maritalStatus==='verheiratet'?'selected':''} value="verheiratet">Verheiratet / eingetragene Partnerschaft</option><option ${p.maritalStatus==='andere'?'selected':''} value="andere">Andere</option></select></label>
      </div>
      <div class="gate-card"><div class="radio-title">Sind Sie aktuell nicht erwerbstätig?</div><div class="radio-card">
        <label class="radio-option"><input type="radio" name="notEmployed" value="yes" ${p.notEmployed==='yes'?'checked':''}><span><b>Ja, aktuell nicht angestellt</b><small>Ich gehe momentan keiner unselbstständigen Erwerbstätigkeit nach.</small></span></label>
        <label class="radio-option"><input type="radio" name="notEmployed" value="no" ${p.notEmployed==='no'?'checked':''}><span><b>Nein, ich bin aktuell angestellt</b><small>Der Prozess für einen Bezug über Selbstständigkeit wird hier gestoppt.</small></span></label>
      </div></div>
      <div class="gate-card"><div class="radio-title">Selbstständigkeit als Bezugsgrund</div><div class="radio-card">
        <label class="radio-option"><input type="radio" name="selfEmployed" value="yes" ${p.selfEmployed==='yes'?'checked':''}><span><b>Ja, ich nehme eine selbstständige Erwerbstätigkeit auf / habe sie aufgenommen</b><small>Die definitive Anerkennung und Bezugsberechtigung wird separat geprüft.</small></span></label>
        <label class="radio-option"><input type="radio" name="selfEmployed" value="checking" ${p.selfEmployed==='checking'?'checked':''}><span><b>Ist noch in Abklärung</b><small>Eine Beratung ist möglich; eine Auszahlung kann erst nach erfüllten Voraussetzungen vorbereitet werden.</small></span></label>
        <label class="radio-option"><input type="radio" name="selfEmployed" value="no" ${p.selfEmployed==='no'?'checked':''}><span><b>Nein</b><small>Dann passt dieser Bezugsprozess aktuell nicht.</small></span></label>
      </div></div>
      <div id="gateMessage"></div>
      ${p.maritalStatus==='verheiratet'?'<div class="warning-strip">Bei Barauszahlungen aus der 2. Säule kann eine schriftliche Zustimmung des Ehegatten bzw. der eingetragenen Partnerperson erforderlich sein.</div>':''}
      <div class="info-strip">Hinweis: „nicht erwerbstätig“ allein löst keinen Anspruch auf Auszahlung aus. Entscheidend sind die gesetzlichen Voraussetzungen und die Prüfung durch die Vorsorgeeinrichtung bzw. zuständigen Stellen.</div>
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Zurück</button><button class="btn primary" id="nextBtn">Guthaben berechnen →</button></div>`;
    const ids=['firstName','lastName','street','postalCode','city','email','phone','maritalStatus']; ids.forEach(id=>document.getElementById(id).oninput=e=>{state.person[id]=e.target.value;if(id==='maritalStatus')renderStep2()});
    document.querySelectorAll('input[name=notEmployed]').forEach(r=>r.onchange=e=>{state.person.notEmployed=e.target.value;updateGate()}); document.querySelectorAll('input[name=selfEmployed]').forEach(r=>r.onchange=e=>{state.person.selfEmployed=e.target.value;updateGate()});
    document.getElementById('backBtn').onclick=()=>go(1); document.getElementById('nextBtn').onclick=()=>{syncPerson(); const problem=validateStep2(); if(problem){document.getElementById('gateMessage').innerHTML=`<div class="error-strip">${esc(problem)}</div>`;return} go(3)}; updateGate();
  }
  function syncPerson(){['firstName','lastName','street','postalCode','city','email','phone','maritalStatus'].forEach(id=>{const el=document.getElementById(id);if(el)state.person[id]=el.value})}
  function validateStep2(){const p=state.person;if(!p.firstName||!p.lastName||!p.street||!/^[1-9]\d{3}$/.test(p.postalCode)||!p.city||!/^\S+@\S+\.\S+$/.test(p.email)||!p.phone)return'Bitte alle Kontakt- und Adressfelder vollständig ausfüllen.';if(!p.maritalStatus)return'Bitte den Zivilstand auswählen.';if(p.notEmployed==='no')return'Dieser Prozess ist für aktuell angestellte Personen blockiert.';if(p.notEmployed!=='yes')return'Bitte bestätigen, ob Sie aktuell nicht erwerbstätig sind.';if(p.selfEmployed==='no')return'Ohne Aufnahme einer selbstständigen Erwerbstätigkeit kann dieser Bezugsweg hier nicht weitergeführt werden.';if(!p.selfEmployed)return'Bitte den Stand Ihrer Selbstständigkeit angeben.';return''}
  function updateGate(){const el=document.getElementById('gateMessage');if(!el)return; if(state.person.notEmployed==='no')el.innerHTML='<div class="error-strip">Stopp: Solange Sie aktuell angestellt sind, kann diese Strecke nicht weitergeführt werden.</div>'; else if(state.person.selfEmployed==='no')el.innerHTML='<div class="error-strip">Stopp: Dieser Prozess ist auf einen möglichen Bezug im Zusammenhang mit der Aufnahme einer Selbstständigkeit ausgerichtet.</div>'; else if(state.person.selfEmployed==='checking')el.innerHTML='<div class="warning-strip">Beratung möglich: Die Selbstständigkeit muss vor einer Auszahlung rechtlich und administrativ geklärt bzw. anerkannt sein.</div>'; else el.innerHTML=''}

  function totals(){const second=sum(state.docs.filter(d=>d.type==='fz'||d.type==='other').map(d=>d.amount)), third=sum(state.docs.filter(d=>d.type==='p3bank'||d.type==='p3insurance').map(d=>d.amount)), total=second+third, fee=total*CONFIG.feeRate,tax=total*CONFIG.taxReserveRate;return{second,third,total,fee,tax,afterFee:total-fee,planning:total-fee-tax}}
  function renderStep3(){const t=totals(); surface.innerHTML=heading('🧮',3,'Guthaben & Kostenübersicht','Alle erfassten Freizügigkeits- und Säule-3a-Guthaben werden zusammengerechnet. Bitte die Werte vor der Anfrage nochmals prüfen.')+`
      <div class="docs-summary">${state.docs.map((d,i)=>`<div class="docs-summary-row"><div><b>${docTypeLabel(d.type)}</b><small>${esc(d.file.name)}</small></div><b>${money(d.amount)}</b></div>`).join('')}</div>
      <div class="summary-grid"><div class="summary-card"><small>2. Säule / Freizügigkeit</small><b>${money(t.second)}</b><span>erfasste Guthaben</span></div><div class="summary-card"><small>Säule 3a</small><b>${money(t.third)}</b><span>Bank &amp; Versicherung</span></div><div class="summary-card total"><small>Gesamtes erfasstes Guthaben</small><b>${money(t.total)}</b><span>vor Honorar und Steuern</span></div><div class="summary-card green"><small>Nach 4% Carlet-Honorar</small><b>${money(t.afterFee)}</b><span>Steuern noch nicht berücksichtigt</span></div></div>
      <div class="breakdown"><div class="breakdown-row"><span>Carlet Finance Coaching · Honorar 4%</span><b>− ${money(t.fee)}</b></div><div class="breakdown-row"><span>Unverbindliche Steuerreserve ca. 6%</span><b>− ${money(t.tax)}</b></div><div class="breakdown-row emphasis"><span>Planungsbetrag nach Honorar + 6%-Reserve</span><b>${money(t.planning)}</b></div></div>
      <div class="warning-strip"><b>Steuerhinweis:</b> Die 6% sind nur eine Planungsannahme. Die tatsächliche Kapitalleistungssteuer ist separat geschuldet und hängt unter anderem von Wohnort, Betrag, Zivilstand und Auszahlungszeitpunkt ab. Sie ist nicht Bestandteil des 4%-Honorars.</div>
      <div class="info-strip"><b>Bezugsprüfung:</b> Die dargestellten Guthaben sind keine Auszahlungszusage. Freizügigkeits- und Säule-3a-Bezüge werden von den jeweiligen Einrichtungen anhand der gesetzlichen Voraussetzungen und Nachweise geprüft.</div>
      <label class="consent-card"><input id="finalConsent" type="checkbox" ${state.finalConsent?'checked':''}><span>Ich habe die erfassten Guthaben kontrolliert und verstanden, dass Steuer und Bezugsberechtigung erst definitiv geprüft werden.</span></label>
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Daten ändern</button><button class="btn primary" id="nextBtn" ${state.finalConsent?'':'disabled'}>Beratung anfragen →</button></div>`;
    document.getElementById('finalConsent').onchange=e=>{state.finalConsent=e.target.checked;document.getElementById('nextBtn').disabled=!state.finalConsent}; document.getElementById('backBtn').onclick=()=>go(2);document.getElementById('nextBtn').onclick=()=>go(4);
  }

  function leadText(){const t=totals(),p=state.person;return `CARLET FINANCE COACHING – VORSORGE-LEAD\n\nKunde: ${p.firstName} ${p.lastName}\nAdresse: ${p.street}, ${p.postalCode} ${p.city}\nE-Mail: ${p.email}\nTelefon: ${p.phone}\nZivilstand: ${p.maritalStatus}\nNicht erwerbstätig: ${p.notEmployed==='yes'?'Ja':'Nein'}\nSelbstständigkeit: ${p.selfEmployed}\n\nDokumente:\n${state.docs.map((d,i)=>`${i+1}. ${docTypeLabel(d.type)} – ${money(d.amount)} – ${d.file.name}`).join('\n')}\n\n2. Säule/Freizügigkeit: ${money(t.second)}\nSäule 3a: ${money(t.third)}\nGesamt: ${money(t.total)}\nCarlet-Honorar 4%: ${money(t.fee)}\nSteuerreserve 6% (unverbindlich): ${money(t.tax)}\nPlanungsbetrag: ${money(t.planning)}\n\nKontaktwunsch: ${state.contactMethod}\nNotiz: ${state.note||'-'}`}
  function renderStep4(){const t=totals();surface.innerHTML=heading('✓',4,'Beratungsanfrage vorbereiten','Die Vorsorgeübersicht ist bereit. Im Live-Betrieb kann dieser Schritt an CRM, E-Mail oder ein internes Lead-System angebunden werden.')+`
      <div class="lead-card"><h3>${esc(state.person.firstName)} ${esc(state.person.lastName)} · ${money(t.total)}</h3><p>Erfasstes Vorsorgeguthaben · 4% Carlet-Honorar: ${money(t.fee)} · unverbindliche 6%-Steuerreserve: ${money(t.tax)}</p></div>
      <label class="select-block"><span>Bevorzugter Kontakt</span><select id="contactMethod"><option ${state.contactMethod==='Telefon'?'selected':''}>Telefon</option><option ${state.contactMethod==='E-Mail'?'selected':''}>E-Mail</option><option ${state.contactMethod==='WhatsApp'?'selected':''}>WhatsApp</option></select></label>
      <label class="select-block"><span>Notiz / gewünschter Rückrufzeitraum</span><textarea id="note" rows="4" placeholder="Optional">${esc(state.note)}</textarea></label>
      <div class="warning-strip">Dieser Prototyp sendet noch keine sensiblen Kundendaten an ein Backend. Für den Live-Betrieb muss ein freigegebenes CRM-/Lead-Ziel mit Datenschutz- und Zugriffsregeln verbunden werden.</div>
      <button class="btn primary action-main" id="copyBtn">Lead-Zusammenfassung kopieren</button>
      <button class="btn soft action-main" id="downloadBtn">Lead als JSON exportieren</button>
      <div id="doneMsg"></div>
      <div class="footer-actions"><button class="btn soft" id="backBtn">← Übersicht</button><button class="btn soft" id="restartBtn">Neue Anfrage</button></div>
      <div class="code-box" id="leadPreview">${esc(leadText())}</div>`;
    document.getElementById('contactMethod').onchange=e=>{state.contactMethod=e.target.value;document.getElementById('leadPreview').textContent=leadText()};document.getElementById('note').oninput=e=>{state.note=e.target.value;document.getElementById('leadPreview').textContent=leadText()};
    document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(leadText());document.getElementById('doneMsg').innerHTML='<div class="success-strip">✓ Lead-Zusammenfassung wurde kopiert.</div>'}catch{document.getElementById('doneMsg').innerHTML='<div class="error-strip">Kopieren wurde vom Browser blockiert. Bitte den Text unten manuell markieren.</div>'}};
    document.getElementById('downloadBtn').onclick=()=>{const payload={createdAt:new Date().toISOString(),person:state.person,documents:state.docs.map(d=>({name:d.file.name,type:d.type,typeLabel:docTypeLabel(d.type),amount:d.amount})),totals:totals(),feeRate:CONFIG.feeRate,taxReserveRate:CONFIG.taxReserveRate,contactMethod:state.contactMethod,note:state.note};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`carlet-lead-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
    document.getElementById('backBtn').onclick=()=>go(3);document.getElementById('restartBtn').onclick=()=>location.reload();
  }
  render();
})();
</script>
</body>
