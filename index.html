<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b13">
  <title>FinCity · Schweiz Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./game-mode.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">FC</div><div><strong>FINCITY</strong><small>SCHWEIZ · DIGITALE IMMOBILIEN · AUKTIONSSPIEL</small></div></div>
    <div class="stats"><span>VERKAUFTE IMMOBILIEN <b>–</b></span><span>PLATTFORMWERT <b>–</b></span><span>AKTIVE AUKTIONEN <b id="trophyCount">–</b></span></div>
    <button id="portfolioTop" class="cta">MEIN SPIELKONTO</button>
  </header>
  <main id="map" class="map"></main>
  <nav class="side-nav" aria-label="FinCity Hauptnavigation">
    <button class="nav-btn active" data-view="city"><span class="ico nav-emoji">🏙️</span><b>STADT</b></button>
    <button class="nav-btn" data-view="citybook"><span class="ico nav-emoji">💬</span><b>CITYBOOK</b></button>
    <button class="nav-btn" data-view="alerts"><span class="ico nav-emoji">🔔</span><b>MELDUNGEN</b></button>
    <button class="nav-btn" data-view="auctions"><span class="ico nav-emoji">🔨</span><b>AUKTIONEN</b></button>
    <button class="nav-btn" data-view="active"><span class="ico nav-emoji">🏢</span><b>VERKAUFT</b></button>
    <button class="nav-btn" data-view="portfolio"><span class="ico nav-emoji">👤</span><b>MEIN KONTO</b></button>
    <button class="nav-btn" data-view="ranking"><span class="ico nav-emoji">🏆</span><b>BESTENLISTE</b></button>
    <button class="nav-btn" data-view="trophies"><span class="ico nav-emoji">🏛️</span><b>MONUMENTE</b></button>
    <button class="nav-btn" data-view="admin"><span class="ico nav-emoji">🎮</span><b>SPIELRUNDE</b></button>
  </nav>
  <section class="map-controls"><button id="investMapBtn" class="active">STADTKARTE</button><button id="satBtn">SATELLIT</button><button id="mapBtn" hidden aria-hidden="true" tabindex="-1">2D</button></section>
  <section class="filters">
    <button class="filter active" data-filter="all">ALLE OBJEKTE</button>
    <button class="filter" data-filter="owned">MEINE GEBÄUDE</button>
    <button class="filter" data-filter="active">VERKAUFTE GEBÄUDE</button>
    <button class="filter" data-filter="auction">AUKTIONEN</button>
    <button class="filter" data-filter="trophy">MONUMENTE</button>
  </section>
  <aside id="panel" class="panel" aria-live="polite"></aside>
  <div class="legend"><span><i class="orange"></i>MEIN</span><span><i class="violet"></i>AKTIV</span><span><i class="cyan"></i>AUKTION</span><span><i class="gold"></i>TROPHY</span></div>
  <div class="build-badge">FINCITY · PLAY-MONEY GAME</div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.js"></script>
  <script src="./mapbox-provider.js"></script>
  <script src="./app.js"></script>
  <script src="./mapbox-runtime.js"></script>
  <script src="./map-layers-fix.js"></script>
  <script src="./generic-buildings.js"></script>
  <script src="./mapbox-buildings.js"></script>
  <script src="./zurich-data-fixes.js"></script>
  <script src="./city-network.js"></script>
  <script src="./landmark-media.js"></script>
  <script src="./municipality.js"></script>
  <script src="./mapbox-controls.js"></script>
  <script src="./city-ui-fixes.js"></script>
  <script src="./address-search.js"></script>
  <script src="./player-preload.js"></script>
  <script src="./game-mode.js"></script>
  <script src="./player-manager.js"></script>
  <script src="./game-market.js"></script>
  <script src="./property-intel.js"></script>
  <script src="./citybook.js"></script>
</body>
</html>
